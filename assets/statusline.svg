<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="330" viewBox="0 0 1400 330" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Mono', Consolas, 'Noto Sans Mono CJK KR', monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20232a"/>
      <stop offset="1" stop-color="#16181d"/>
    </linearGradient>
  </defs>

  <!-- terminal window -->
  <rect x="8" y="8" width="1384" height="314" rx="14" fill="url(#bgGrad)" stroke="#33363e" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="36" cy="36" r="7" fill="#ff5f57"/>
  <circle cx="60" cy="36" r="7" fill="#febc2e"/>
  <circle cx="84" cy="36" r="7" fill="#28c840"/>
  <text x="700" y="41" font-size="14" fill="#9aa0ab" text-anchor="middle">Claude Code — statusline</text>
  <line x1="8" y1="58" x2="1392" y2="58" stroke="#33363e" stroke-width="1"/>

  <!-- (1) idle -->
  <text x="40" y="98" font-size="13" fill="#6b7280"># idle — codex/claude quota left · time to reset · context used</text>
  <text x="40" y="128" font-size="16" xml:space="preserve"><tspan fill="#e8eaed" font-weight="bold">folder</tspan><tspan fill="#5c626e"> · </tspan><tspan fill="#cf6bdd">Fable 5 (high)</tspan><tspan fill="#5c626e"> · </tspan><tspan fill="#10A37F">codex</tspan><tspan fill="#8a8f99"> ▕</tspan><tspan fill="#10A37F">▆▆▆▆▆▆▆▆▆▆▆▆▆▆</tspan><tspan fill="#8a8f99">▏</tspan><tspan fill="#e8eaed">98%</tspan><tspan fill="#7b8290"> ↻4h2m</tspan><tspan fill="#5c626e"> · </tspan><tspan fill="#D97757">claude</tspan><tspan fill="#8a8f99"> ▕</tspan><tspan fill="#D97757">▄▄▄▄▄▄▄▄▄▄▄</tspan><tspan fill="#4a4e57">░░░</tspan><tspan fill="#8a8f99">▏</tspan><tspan fill="#e8eaed">76%</tspan><tspan fill="#7b8290"> ↻2h13m</tspan><tspan fill="#5c626e"> · </tspan><tspan fill="#4ec97a">ctx 42%</tspan></text>

  <!-- (2) task in progress -->
  <text x="40" y="178" font-size="13" fill="#6b7280"># task in progress — current in-progress task after the gauges</text>
  <text x="40" y="208" font-size="16" xml:space="preserve"><tspan fill="#e8eaed" font-weight="bold">folder</tspan><tspan fill="#5c626e"> · </tspan><tspan fill="#cf6bdd">Fable 5 (high)</tspan><tspan fill="#5c626e"> · </tspan><tspan fill="#10A37F">codex</tspan><tspan fill="#8a8f99"> ▕</tspan><tspan fill="#10A37F">▆▆▆▆▆▆▆▆▆▆▆▆▆▆</tspan><tspan fill="#8a8f99">▏</tspan><tspan fill="#e8eaed">98%</tspan><tspan fill="#5c626e"> · </tspan><tspan fill="#D97757">claude</tspan><tspan fill="#8a8f99"> ▕</tspan><tspan fill="#D97757">▄▄▄▄▄▄▄▄▄▄▄</tspan><tspan fill="#4a4e57">░░░</tspan><tspan fill="#8a8f99">▏</tspan><tspan fill="#e8eaed">76%</tspan><tspan fill="#5c626e"> · </tspan><tspan fill="#4ec97a">ctx 42%</tspan><tspan fill="#5c626e"> · </tspan><tspan fill="#e5c07b">▸ Codex: login API</tspan></text>

  <!-- (3) close to the limit -->
  <text x="40" y="258" font-size="13" fill="#6b7280"># close to the limit — under 30% left is yellow, under 10% red / block height = weekly left</text>
  <text x="40" y="288" font-size="16" xml:space="preserve"><tspan fill="#e8eaed" font-weight="bold">folder</tspan><tspan fill="#5c626e"> · </tspan><tspan fill="#cf6bdd">Fable 5 (high)</tspan><tspan fill="#5c626e"> · </tspan><tspan fill="#10A37F">codex</tspan><tspan fill="#8a8f99"> ▕</tspan><tspan fill="#e5c07b">▂▂▂▂</tspan><tspan fill="#4a4e57">░░░░░░░░░░</tspan><tspan fill="#8a8f99">▏</tspan><tspan fill="#e8eaed">28%</tspan><tspan fill="#7b8290"> ↻41m</tspan><tspan fill="#5c626e"> · </tspan><tspan fill="#D97757">claude</tspan><tspan fill="#8a8f99"> ▕</tspan><tspan fill="#e06c75">▂</tspan><tspan fill="#4a4e57">░░░░░░░░░░░░░</tspan><tspan fill="#8a8f99">▏</tspan><tspan fill="#e8eaed">8%</tspan><tspan fill="#7b8290"> ↻19m</tspan><tspan fill="#5c626e"> · </tspan><tspan fill="#e06c75">ctx 93%</tspan></text>
</svg>
